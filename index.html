<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>khalahamed.cl</title>
  <link rel="icon" type="image/png" href="explo.jpg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --dur: 0.75s;
      --ease: cubic-bezier(0.65, 0, 0.35, 1);
    }

    body {
      background: #fff;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }

    #intro {
      position: fixed;
      inset: 0;
      z-index: 100;
      cursor: pointer;
      opacity: 0;
      transition: opacity 1.5s ease;
    }

    #intro img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #intro.visible { opacity: 1; }
    #intro.saliendo { opacity: 0; transition: opacity 1s ease; }

    #contenido {
      opacity: 0;
      transition: opacity 1s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 60px 0;
    }

    #contenido.visible { opacity: 1; }

    .carrusel-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      width: 100%;
    }

    .carrusel {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      position: relative;
      height: 940px;
    }

    .card {
      position: absolute;
      cursor: pointer;
      transition: transform var(--dur) var(--ease), opacity var(--dur) var(--ease);
      transform-origin: center center;
      will-change: transform, opacity;
    }

    .card img.foto {
      display: block;
      object-fit: cover;
      transition: width var(--dur) var(--ease), height var(--dur) var(--ease);
      will-change: width, height;
    }

    /* desvanecido de bordes con overlay: transiciona de verdad,
       a diferencia de mask-image que saltaba de golpe */
    .card::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0;
      transition: opacity var(--dur) var(--ease);
    }

    .card.es-izq::after {
      opacity: 1;
      background: linear-gradient(to left, transparent, #fff);
    }

    .card.es-der::after {
      opacity: 1;
      background: linear-gradient(to right, transparent, #fff);
    }

    .btn-play {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.35s var(--ease);
      pointer-events: none;
      z-index: 2;
    }

    /* solo la card central muestra el btn al hover */
    .card.es-centro:hover .btn-play { opacity: 1; }

    .btn-play svg {
      width: 36px;
      height: 36px;
      fill: white;
      filter: drop-shadow(0 0 4px rgba(0,0,0,0.6));
    }

    .flecha {
      position: absolute;
      z-index: 10;
      cursor: pointer;
      background: none;
      border: none;
      padding: 10px;
      animation: parpadeo 3s ease-in-out infinite;
      transition: transform 0.4s var(--ease);
    }

    /* orientación horizontal: centrada en Y */
    .flecha-izq, .flecha-der { top: 50%; }
    .flecha-izq { left: 20px;  transform: translateY(-50%); }
    .flecha-der { right: 20px; transform: translateY(-50%); }
    .flecha-izq:hover, .flecha-der:hover   { transform: translateY(-50%) scale(1.15); }
    .flecha-izq:active, .flecha-der:active { transform: translateY(-50%) scale(0.95); }

    /* orientación vertical: centrada en X */
    .flecha-arr, .flecha-abj { left: 50%; }
    .flecha-arr { top: 0;    transform: translateX(-50%); }
    .flecha-abj { bottom: 0; transform: translateX(-50%); }
    .flecha-arr:hover, .flecha-abj:hover   { transform: translateX(-50%) scale(1.15); }
    .flecha-arr:active, .flecha-abj:active { transform: translateX(-50%) scale(0.95); }

    .flecha svg {
      width: 32px;
      height: 32px;
      fill: none;
      stroke: #222;
      stroke-width: 2;
    }

    @keyframes parpadeo {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.45; }
    }

    nav {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    nav a, .contacto {
      color: black;
      text-decoration: none;
      font-size: 22px;
      letter-spacing: 8px;
      text-transform: lowercase;
      transition: opacity 0.4s var(--ease), letter-spacing 0.4s var(--ease);
    }

    nav a:hover, .contacto:hover { opacity: 0.35; letter-spacing: 10px; }

    .contacto {
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    @media (max-width: 768px) {
      #intro { background: #000; }
      #intro img { object-fit: contain; }

      .carrusel { height: 640px; }

      nav a, .contacto { font-size: 16px; letter-spacing: 5px; }
    }
  </style>
</head>
<body>

  <div id="intro">
    <img id="introImg" src="back1.png" alt="">
  </div>

  <div id="contenido">
    <div class="carrusel-wrap">

      <div class="carrusel" id="carrusel">
        <button class="flecha flecha-arr" onclick="moverV(-1)">
          <svg viewBox="0 0 24 24"><polyline points="6,15 12,9 18,15"/></svg>
        </button>
        <button class="flecha flecha-abj" onclick="moverV(1)">
          <svg viewBox="0 0 24 24"><polyline points="6,9 12,15 18,9"/></svg>
        </button>
        <button class="flecha flecha-izq" onclick="mover(-1)">
          <svg viewBox="0 0 24 24"><polyline points="15,18 9,12 15,6"/></svg>
        </button>
        <button class="flecha flecha-der" onclick="mover(1)">
          <svg viewBox="0 0 24 24"><polyline points="9,6 15,12 9,18"/></svg>
        </button>
      </div>

      <nav>
        <a href="https://soundcloud.com/20149173" target="_blank">soundcloud</a>
        <a href="https://instagram.com/khalahamedd" target="_blank">instagram</a>
        <a href="mailto:keepgoing9173@gmail.com" class="contacto">contacto</a>
      </nav>

    </div>
  </div>

  <audio id="musica" src="x.mp3" loop></audio>

  <script>
    /* ============================================================
       SONIDOS DE LA INTERFAZ  (efectos de sonido)
       Pon la ruta de tu archivo entre comillas. Si queda '' no suena.
       ============================================================ */
    const SONIDOS = {
      play:           '',   // sonido de play aqui
      stop:           '',   // sonido stop aqui
      scrollVertical: '',   // scrool vertical aqui
      cambiarCancion: '',   // cambiar cancion
    };

    function sonar(cual) {
      const src = SONIDOS[cual];
      if (!src) return;                 // vacío = no hace nada
      const a = new Audio(src);
      a.volume = 0.6;
      a.play().catch(() => {});         // si falta el archivo, no rompe nada
    }

    /* ============================================================
       EJE HORIZONTAL  (los temas que ya tenías)
       ============================================================ */
    const tracks = [
      { img: 'graciaskhalahamed.jpg',  audio: 'mmm.mp3'        },
      { img: 'explo.jpg',  audio: 'avril14.mp3' },
      { img: 'brazo.jpg',  audio: 'caos.mp3' },
      { img: 'icongreen.png',  audio: '5.mp3' },
      { img: 'charge.jpg',  audio: 'ope.mp3' },
      { img: 'tacos.jpg',  audio: 'cunt.mp3' },
      { img: 'piano.jpg',  audio: 'edward.mp3' },
      { img: 'space.jpg',  audio: 'code.mp3' },
      { img: 'two.jpg',  audio: 'goodtime.mp3' },
    ];

    /* ============================================================
       EJE VERTICAL  (copia del horizontal)
       El audio lleva "VERTICAL " antes del nombre: reemplaza cada
       archivo por el tuyo, ej: 'VERTICAL mmm.mp3'.
       El img queda igual para que se vea bien mientras tanto;
       cámbialo también si quieres portadas distintas.
       ============================================================ */
    const tracksVertical = [
      { img: 'graciaskhalahamed.jpg',  audio: 'VERTICAL mmm.mp3'        },
      { img: 'explo.jpg',  audio: 'VERTICAL avril14.mp3' },
      { img: 'brazo.jpg',  audio: 'VERTICAL caos.mp3' },
      { img: 'icongreen.png',  audio: 'VERTICAL 5.mp3' },
      { img: 'charge.jpg',  audio: 'VERTICAL ope.mp3' },
      { img: 'tacos.jpg',  audio: 'VERTICAL cunt.mp3' },
      { img: 'piano.jpg',  audio: 'VERTICAL edward.mp3' },
      { img: 'space.jpg',  audio: 'VERTICAL code.mp3' },
      { img: 'two.jpg',  audio: 'VERTICAL goodtime.mp3' },
    ];

    const play  = '<polygon points="5,3 19,12 5,21"/>';
    const pause = '<rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/>';

    const isMobile = window.innerWidth <= 768;

    // tamaños y espaciados según pantalla
    const SIZES   = isMobile ? [200, 130, 90]  : [320, 200, 140];
    const GAPS    = isMobile ? [170, 130]       : [300, 220];
    const DROPS   = isMobile ? [0, 25, 50]      : [0, 35, 65];

    // eje vertical: separación desde el centro hacia arriba/abajo
    const VGAP    = isMobile ? 190 : 300;

    let current = 0;      // posición del eje HORIZONTAL
    let currentV = 0;     // posición del eje VERTICAL
    let ejeActivo = 'h';  // qué eje ocupa el centro de la cruz: 'h' | 'v'
    let currentAudio = null;
    let currentIcon  = null;
    const carrusel = document.getElementById('carrusel');
    const cards = [];     // cards del eje horizontal
    const cardsV = [];    // cards del eje vertical
    const audioEls = [];
    const audioElsV = [];

    // Crea las cards de un eje. eje = 'h' (horizontal) o 'v' (vertical)
    function crearCards(lista, arrCards, arrAudio, getPosFn, moverFn, eje) {
      lista.forEach((t, i) => {
        const audio = document.createElement('audio');
        audio.src = t.audio;
        // los archivos VERTICAL aún no existen: no pedirlos hasta que se clicke
        if (eje === 'v') audio.preload = 'none';
        document.body.appendChild(audio);
        arrAudio.push(audio);

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img class="foto" src="${t.img}" alt="">
          <div class="btn-play">
            <svg viewBox="0 0 24 24">${play}</svg>
          </div>
        `;

        card.addEventListener('click', () => {
          const pos = getPosFn(i);

          if (pos !== 0) {
            // click en un lado → navegar por ese eje
            moverFn(pos > 0 ? 1 : -1);
            return;
          }

          // click en el centro → play / stop
          const aud = arrAudio[i];
          const icon = card.querySelector('svg');

          if (currentAudio && currentAudio !== aud) {
            currentAudio.pause();
            currentAudio.currentTime = 0;
            if (currentIcon) currentIcon.innerHTML = play;
          }

          if (aud.paused) {
            aud.play().catch(() => {});
            icon.innerHTML = pause;
            sonar('play');
          } else {
            aud.pause();
            icon.innerHTML = play;
            sonar('stop');
          }

          aud.onended = () => { icon.innerHTML = play; };
          currentAudio = aud;
          currentIcon  = icon;
        });

        carrusel.appendChild(card);
        arrCards.push(card);
      });
    }

    crearCards(tracks,         cards,  audioEls,  getPos,  mover,  'h');
    crearCards(tracksVertical, cardsV, audioElsV, getPosV, moverV, 'v');

    function getPos(i) {
      const total = tracks.length;
      let pos = i - current;
      if (pos > total / 2)  pos -= total;
      if (pos < -total / 2) pos += total;
      return pos;
    }

    function getPosV(i) {
      const total = tracksVertical.length;
      let pos = i - currentV;
      if (pos > total / 2)  pos -= total;
      if (pos < -total / 2) pos += total;
      return pos;
    }

    // aplica tamaño/opacidad/posición a una card
    function pintar(card, size, opacity, zIndex, x, y, oculta) {
      const foto = card.querySelector('img.foto');
      foto.style.width  = size + 'px';
      foto.style.height = size + 'px';
      card.style.opacity      = opacity;
      card.style.zIndex       = zIndex;
      card.style.pointerEvents = oculta ? 'none' : 'auto';
      card.style.left = '50%';
      card.style.top  = '50%';
      card.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
    }

    function render() {
      /* ---------- EJE HORIZONTAL (izq / der) ---------- */
      cards.forEach((card, i) => {
        const pos = getPos(i);
        const abs = Math.abs(pos);
        const esCentro = pos === 0;
        const oculta = esCentro ? ejeActivo !== 'h' : abs > 2;

        const size    = SIZES[Math.min(abs, SIZES.length - 1)];
        const opacity = oculta ? 0 : (abs === 0 ? 1 : abs === 1 ? 0.55 : 0.2);
        const zIndex  = esCentro && ejeActivo === 'h' ? 20 : 10 - abs;

        const x = pos === 0
          ? 0
          : (pos > 0 ? 1 : -1) * (GAPS[0] + Math.max(0, abs - 1) * GAPS[1]);
        const y = DROPS[Math.min(abs, DROPS.length - 1)];

        pintar(card, size, opacity, zIndex, x, y, oculta);

        card.classList.toggle('es-centro', esCentro && ejeActivo === 'h');
        card.classList.toggle('es-izq', pos < 0 && abs === 2);
        card.classList.toggle('es-der', pos > 0 && abs === 2);
      });

      /* ---------- EJE VERTICAL (arr / abj) ---------- */
      cardsV.forEach((card, i) => {
        const pos = getPosV(i);
        const abs = Math.abs(pos);
        const esCentro = pos === 0;
        const oculta = esCentro ? ejeActivo !== 'v' : abs > 1;

        const size    = SIZES[Math.min(abs, SIZES.length - 1)];
        const opacity = oculta ? 0 : (abs === 0 ? 1 : 0.55);
        const zIndex  = esCentro && ejeActivo === 'v' ? 20 : 9 - abs;

        const x = 0;
        const y = pos * VGAP;

        pintar(card, size, opacity, zIndex, x, y, oculta);

        card.classList.toggle('es-centro', esCentro && ejeActivo === 'v');
        card.classList.remove('es-izq', 'es-der');
      });
    }

    function mover(dir) {
      current = (current + dir + tracks.length) % tracks.length;
      ejeActivo = 'h';
      sonar('cambiarCancion');
      render();
    }

    function moverV(dir) {
      currentV = (currentV + dir + tracksVertical.length) % tracksVertical.length;
      ejeActivo = 'v';
      sonar('scrollVertical');
      render();
    }

    render();

    const intro     = document.getElementById('intro');
    const introImg  = document.getElementById('introImg');
    const contenido = document.getElementById('contenido');
    const musica    = document.getElementById('musica');

    const backs = [
      'back1.png','back2.png','back3.png','back4.png',
      'back5.png','back6.png','back7.png','back8.png'
    ];

    backs.forEach(src => { new Image().src = src; });

    let bi = 0;
    let intervaloBack = null;

    setTimeout(() => {
      intro.classList.add('visible');
      intervaloBack = setInterval(() => {
        bi = (bi + 1) % backs.length;
        introImg.src = backs[bi];
      }, 100);
    }, 100);

    intro.addEventListener('click', () => {
      clearInterval(intervaloBack);
      musica.play();
      intro.classList.add('saliendo');
      setTimeout(() => {
        intro.style.display = 'none';
        document.body.style.overflow = 'auto';
        contenido.classList.add('visible');
      }, 1000);
    });
  </script>

</body>
</html>
